# The controller drives mpv through JSON IPC. mpv must never react to a
# keyboard, a mouse or the terminal, and must never draw its own interface.
idle=yes
force-window=yes
keep-open=no
input-default-bindings=no
input-vo-keyboard=no
input-terminal=no
osc=no
osd-level=0
osd-bar=no
cursor-autohide=always
fullscreen=yes
hwdec=auto-safe
audio-channels=stereo
volume-max=100
msg-level=all=info
