[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rickroll-briefcase-controller"
version = "0.1.0"
description = "Lid, arm switch, player control and web app for the Rickroll Briefcase."
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn>=0.29,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.9",
  "pydantic>=2.6,<3",
  "jeepney>=0.8",
]

[project.optional-dependencies]
gpio = [
  "gpiozero>=2.0,<3",
  "lgpio>=0.2.2",
]
dev = [
  "gpiozero>=2.0,<3",
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.4",
]

[project.scripts]
briefcase-controller = "briefcase.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
briefcase = ["templates/*.html", "static/*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "ASYNC"]
# Rename and unlink are fast metadata operations. They do not need a thread.
ignore = ["ASYNC240"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
