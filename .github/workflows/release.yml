name: "Release"

on:
  push:
    tags:
      - "v*"

permissions:
  contents: "write"

jobs:
  release:
    name: "Make the GitHub release"
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7"
      - name: "Make the release files"
        run: "./scripts/make_release_assets.sh \"${GITHUB_REF_NAME}\" dist"
      - name: "Build the signed Android app"
        env:
          KEYSTORE_BASE64: "${{ secrets.BRIEFCASE_KEYSTORE_BASE64 }}"
          BRIEFCASE_KEYSTORE_PASSWORD: "${{ secrets.BRIEFCASE_KEYSTORE_PASSWORD }}"
          BRIEFCASE_KEY_ALIAS: "${{ secrets.BRIEFCASE_KEY_ALIAS }}"
          BRIEFCASE_KEY_PASSWORD: "${{ secrets.BRIEFCASE_KEY_PASSWORD }}"
        run: |
          if [[ -z "${KEYSTORE_BASE64}" ]]; then
            echo "::warning::The release key secrets are not set. The release has no Android app."
            exit 0
          fi
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode >"${RUNNER_TEMP}/release.jks"
          export BRIEFCASE_KEYSTORE_FILE="${RUNNER_TEMP}/release.jks"
          export BRIEFCASE_VERSION_NAME="${GITHUB_REF_NAME#v}"
          export BRIEFCASE_VERSION_CODE="${GITHUB_RUN_NUMBER}"
          apk="dist/briefcase-${GITHUB_REF_NAME}.apk"
          ./scripts/build_android.sh release "${apk}"
          (cd dist && sha256sum "$(basename "${apk}")" >>SHA256SUMS)
          rm -f "${BRIEFCASE_KEYSTORE_FILE}"
      - name: "Make the release"
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          prerelease_flag=""
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            prerelease_flag="--prerelease"
          fi
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            ${prerelease_flag}
