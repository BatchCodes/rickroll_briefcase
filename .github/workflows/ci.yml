name: "CI"

on:
  push:
    branches:
      - "main"
  pull_request:

permissions:
  contents: "read"

jobs:
  controller_tests:
    name: "Controller tests and lint"
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7"
      - name: "Run ruff and pytest in Docker"
        run: "docker compose -f compose.test.yml run --rm --build test"

  shellcheck:
    name: "Shell scripts"
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7"
      - name: "Run shellcheck"
        run: >-
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:stable
          -x *.sh scripts/*.sh scripts/tests/*.sh tools/*.sh player/*.sh
      - name: "Test the update script"
        run: "./scripts/tests/test_update.sh"

  docs:
    name: "Markdown lint and spelling"
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7"
      - uses: "DavidAnson/markdownlint-cli2-action@v24"
        with:
          globs: "**/*.md"
      - uses: "streetsidesoftware/cspell-action@v9"
        with:
          files: "**/*.md"
          incremental_files_only: false

  integration:
    name: "Laptop mode smoke test"
    runs-on: "ubuntu-latest"
    env:
      BRIEFCASE_PLAYER_OUTPUT: "null"
    steps:
      - uses: "actions/checkout@v7"
      - name: "Write the environment file"
        run: "./scripts/write_env.sh"
      - name: "Make a test video"
        run: "./tools/make_test_video.sh --duration 40"
      - name: "Start the containers"
        run: "docker compose -f compose.yml -f compose.dev.yml up -d --build --wait"
      - name: "Check that the lid starts and stops the video"
        run: "./scripts/smoke_test.sh http://localhost:8080"
      - name: "Show the logs"
        if: always()
        run: "docker compose -f compose.yml -f compose.dev.yml logs"

  android:
    name: "Android app"
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7"
      - name: "Run the unit tests and build a debug APK"
        run: "./scripts/build_android.sh debug dist/briefcase-debug.apk"
      - uses: "actions/upload-artifact@v7"
        with:
          name: "briefcase-debug-apk"
          path: "dist/briefcase-debug.apk"
          retention-days: 14
