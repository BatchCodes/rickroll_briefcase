<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Helvetica, Arial, sans-serif">
  <title>Power latch wiring for the Rickroll Briefcase</title>
  <rect x="0" y="0" width="900" height="640" fill="#f6f6f6"/>
  <text x="40" y="40" font-size="22" fill="#111111" text-anchor="start" font-weight="bold">Power latch wiring</text>
  <text x="40" y="62" font-size="12" fill="#555555" text-anchor="start" font-weight="normal">Two Pololu Big Pushbutton Power Switch MP boards in the VBUS wires of two cut USB-C cables</text>
  <rect x="40" y="100" width="170" height="300" rx="8" fill="#ffffff" stroke="#111111" stroke-width="2"/><text x="50" y="122" font-size="13" fill="#111111" text-anchor="start" font-weight="bold">Power bank</text><text x="50" y="140" font-size="11" fill="#555555" text-anchor="start" font-weight="normal">Anker 737</text><text x="200" y="144" font-size="11" fill="#555555" text-anchor="end" font-weight="normal">USB-C 1</text><text x="200" y="324" font-size="11" fill="#555555" text-anchor="end" font-weight="normal">USB-C 2</text><rect x="330" y="100" width="170" height="110" rx="8" fill="#ffffff" stroke="#17868f" stroke-width="2"/><text x="340" y="122" font-size="13" fill="#111111" text-anchor="start" font-weight="bold">Power latch 1: Pi</text><rect x="330" y="290" width="170" height="110" rx="8" fill="#ffffff" stroke="#17868f" stroke-width="2"/><text x="340" y="312" font-size="13" fill="#111111" text-anchor="start" font-weight="bold">Power latch 2: monitor</text><rect x="640" y="100" width="230" height="170" rx="8" fill="#ffffff" stroke="#111111" stroke-width="2"/><text x="650" y="122" font-size="13" fill="#111111" text-anchor="start" font-weight="bold">Raspberry Pi</text><text x="650" y="140" font-size="11" fill="#555555" text-anchor="start" font-weight="normal">USB-C power in</text><text x="650" y="194" font-size="11" fill="#555555" text-anchor="start" font-weight="normal">pin 5, GPIO 3</text><text x="650" y="239" font-size="11" fill="#555555" text-anchor="start" font-weight="normal">pin 37, GPIO 26</text><rect x="640" y="290" width="230" height="70" rx="8" fill="#ffffff" stroke="#111111" stroke-width="2"/><text x="650" y="312" font-size="13" fill="#111111" text-anchor="start" font-weight="bold">Monitor</text><text x="650" y="330" font-size="11" fill="#555555" text-anchor="start" font-weight="normal">USB-C power in</text><rect x="640" y="440" width="230" height="120" rx="8" fill="#ffffff" stroke="#d08a00" stroke-width="2"/><text x="650" y="462" font-size="13" fill="#111111" text-anchor="start" font-weight="bold">Power switch</text><text x="650" y="480" font-size="11" fill="#555555" text-anchor="start" font-weight="normal">2-pole toggle switch</text><text x="650" y="494" font-size="11" fill="#555555" text-anchor="start" font-weight="normal">pole 1</text><text x="650" y="544" font-size="11" fill="#555555" text-anchor="start" font-weight="normal">pole 2</text><rect x="300" y="470" width="230" height="110" rx="8" fill="#ffffff" stroke="#8c564b" stroke-width="2"/><text x="310" y="492" font-size="13" fill="#111111" text-anchor="start" font-weight="bold">ON pulse</text><text x="310" y="510" font-size="11" fill="#555555" text-anchor="start" font-weight="normal">C1 1 µF from pole 2 to ON</text><text x="310" y="525" font-size="11" fill="#555555" text-anchor="start" font-weight="normal">R1 100 kΩ from ON to GND</text><text x="310" y="540" font-size="11" fill="#555555" text-anchor="start" font-weight="normal">R2 1 MΩ from pole 2 to GND</text><text x="310" y="555" font-size="11" fill="#555555" text-anchor="start" font-weight="normal">D1 BAT85, cathode to ON</text>
