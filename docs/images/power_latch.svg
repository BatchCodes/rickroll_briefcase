troke="#8c564b" stroke-width="2.5" fill="none" stroke-linejoin="round"/><path d="M380,470 L380,400" stroke="#f6f6f6" stroke-width="7" fill="none"/><path d="M380,470 L380,400" stroke="#8c564b" stroke-width="2.5" fill="none" stroke-linejoin="round"/><path d="M380,210 L380,250 L315,250 L315,440 L380,440" stroke="#f6f6f6" stroke-width="7" fill="none"/><path d="M380,210 L380,250 L315,250 L315,440 L380,440" stroke="#8c564b" stroke-width="2.5" fill="none" stroke-linejoin="round"/><path d="M450,400 L450,440 L590,440 L590,235 L640,235" stroke="#f6f6f6" stroke-width="7" fill="none"/><path d="M450,400 L450,440 L590,440 L590,235 L640,235" stroke="#17868f" stroke-width="2.5" fill="none" stroke-linejoin="round"/><path d="M450,210 L450,250 L520,250 L520,440" stroke="#f6f6f6" stroke-width="7" fill="none"/><path d="M450,210 L450,250 L520,250 L520,440" stroke="#17868f" stroke-width="2.5" fill="none" stroke-linejoin="round"/><path d="M640,190 L625,190 L625,470 L640,470" stroke="#f6f6f6" stroke-width="7" fill="none"/><path d="M640,190 L625,190 L625,470 L640,470" stroke="#d08a00" stroke-width="2.5" fill="none" stroke-linejoin="round"/><path d="M640,490 L600,490" stroke="#f6f6f6" stroke-width="7" fill="none"/><path d="M640,490 L600,490" stroke="#222222" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
  <text x="336" y="144" font-size="10" fill="#555555" text-anchor="start" font-weight="normal">VIN</text><text x="336" y="184" font-size="10" fill="#555555" text-anchor="start" font-weight="normal">GND</text><text x="494" y="144" font-size="10" fill="#555555" text-anchor="end" font-weight="normal">VOUT</text><text x="380" y="204" font-size="10" fill="#555555" text-anchor="middle" font-weight="normal">ON</text><text x="450" y="204" font-size="10" fill="#555555" text-anchor="middle" font-weight="normal">OFF</text><text x="336" y="334" font-size="10" fill="#555555" text-anchor="start" font-weight="normal">VIN</text><text x="336" y="374" font-size="10" fill="#555555" text-anchor="start" font-weight="normal">GND</text><text x="494" y="334" font-size="10" fill="#555555" text-anchor="end" font-weight="normal">VOUT</text><text x="380" y="394" font-size="10" fill="#555555" text-anchor="middle" font-weight="normal">ON</text><text x="450" y="394" font-size="10" fill="#555555" text-anchor="middle" font-weight="normal">OFF</text>
  <text x="218" y="132" font-size="11" fill="#d62728" text-anchor="start" font-weight="normal">VBUS: cut</text><text x="262" y="78" font-size="11" fill="#555555" text-anchor="start" font-weight="normal">CC, GND, D+ and D−: not cut</text><text x="262" y="263" font-size="11" fill="#555555" text-anchor="start" font-weight="normal">CC, GND, D+ and D−: not cut</text><text x="596" y="494" font-size="11" fill="#111111" text-anchor="end" font-weight="normal">GND</text><text x="586" y="460" font-size="10" fill="#555555" text-anchor="end" font-weight="normal">R3 10 kΩ in series, R4 100 kΩ to GND</text><circle cx="290" cy="140" r="4" fill="#d62728"/><circle cx="255" cy="85" r="4" fill="#222222"/><circle cx="255" cy="270" r="4" fill="#222222"/><circle cx="380" cy="440" r="4" fill="#8c564b"/><circle cx="520" cy="440" r="4" fill="#17868f"/>
